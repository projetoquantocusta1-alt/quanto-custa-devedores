name: Atualizar devedores da União

on:
  schedule:
    - cron: "41 14 * * 1"   # toda segunda, 11:41 (Brasília): Dívida Ativa + cruzamento com emendas e notas fiscais
  workflow_dispatch:
    inputs:
      forcar:
        description: "Refazer mesmo sem trimestre novo (sim/não)"
        required: false
        default: "não"

permissions:
  contents: write

concurrency:
  group: atualizar-devedores
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Baixar os fornecedores dos outros sites do Quanto Custa (só as pastas necessárias)
        run: |
          F="$RUNNER_TEMP/fontes"; mkdir -p "$F"
          pega() {  # repositório, pasta de destino, padrões
            git clone -q --depth 1 --filter=blob:none --no-checkout "https://github.com/projetoquantocusta1-alt/$1" "$F/$2"
            (cd "$F/$2" && git sparse-checkout set --no-cone "${@:3}" && git checkout -q)
          }
          pega quanto-custa-deputados deputados '/docs/dados/*/fornecedores/' '/docs/dados/*/resumo.json'
          pega quanto-custa-senadores senadores '/docs/dados/*/fornecedores.json' '/docs/dados/*/resumo.json'
          pega quanto-custa-deputados-estaduais estaduais '/docs/dados/*/*/fornecedores.json'
          pega quanto-custa-municipios municipios '/docs/dados/f/' '/docs/dados/resumo.json'
          du -sh "$F"/*
      - name: Coletar na PGFN, cruzar e montar o site
        run: python atualizar.py --fontes "$RUNNER_TEMP/fontes" ${{ github.event.inputs.forcar == 'sim' && '--forcar' || '' }}
      - name: Publicar
        if: always()
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p docs/dados
          git add docs/dados
          if ! git diff --cached --quiet; then
            git commit -m "devedores: dados de $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main || true
              if git push; then break; fi
              sleep $((i*20)); [ $i = 5 ] && exit 1
            done
          fi
