name: Sondagem (PGFN)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Endereço de um .zip para listar (opcional)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: if [ -n "${{ github.event.inputs.url }}" ]; then python sondar_zip.py "${{ github.event.inputs.url }}"; else python sondar.py; fi
      - name: Publicar
        if: always()
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          git add dados_brutos
          git diff --cached --quiet || (git commit -m "sondagem PGFN" && git push)
